# Harness PR check (spoke template). Copy to .github/workflows/harness-pr-check.yml in a spoke.
# Quick checks run first so build and test health are never blocked by scope audits on minor changes.
name: Harness PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5

      # Quick checks from the spoke's CLAUDE.md (music-story: uv for Python, npm for the Observable site).
      - name: Lint
        run: npm run lint --silent

      - name: Unit tests
        run: |
          uv run python scripts/make_fixtures.py
          uv run pytest -q
          uv run ruff check

      - name: Site build
        run: cd site && npm ci --no-audit --no-fund && npm run build

      # Scope, Red tripwires, and test-assertion audit. Advisory mode reports findings without blocking low-risk PRs.
      - name: PR scope check
        continue-on-error: true
        run: node .harness/scripts/pr-scope-check.mjs origin/${{ github.base_ref }} HEAD
