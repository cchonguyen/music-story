# Harness PR check (spoke template). Copy to .github/workflows/harness-pr-check.yml in a spoke.
# Blocking: the PR shows red when the scope check or a quick check fails. Free GitHub plan, so no branch protection.
name: Harness PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5

      # Scope, Red tripwires, and test-assertion rule. --strict makes problems exit 1.
      - name: PR scope check
        run: node .harness/scripts/pr-scope-check.mjs origin/${{ github.base_ref }} HEAD --strict

      # Quick checks from the spoke's CLAUDE.md (music-story: uv for Python, npm for the Observable site).
      - name: Lint
        run: npm run lint --silent

      - name: Unit tests
        run: |
          uv run python scripts/make_fixtures.py
          uv run pytest -q
          uv run ruff check

      - name: Site build
        run: cd site && npm ci --no-audit --no-fund && npm run build
